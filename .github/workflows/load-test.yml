name: Load test

# Weekly and on demand. Not a required PR status check: it seeds about 0.5 GB of data and takes a while.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for the CI service container only (not real secrets).
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ddcl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ddcl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-password@localhost:5432/ddcl_test
      # 5 KB snapshots keep the seed near 0.5 GB; the full 20 KB run is for local machines with disk to spare.
      LOAD_SNAPSHOT_KB: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:load
