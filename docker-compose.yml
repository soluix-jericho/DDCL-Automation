name: ddcl-portal

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ddcl_pgdata:/var/lib/postgresql/data
    # No "ports": the database is reachable only inside the Compose network (NFR2.4).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      # Allowed browser origins (CORS and the Origin check on writes). No default: an empty value stops the backend
      # at start, so an old setting is never silently replaced. FRONTEND_ORIGIN is still read when ALLOWED_ORIGINS is empty.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      # First admin, used only while the User table is empty. No default for the password.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # scrypt runs in the libuv pool: 8 threads keep two hashes plus database work from queueing behind each other.
      UV_THREADPOOL_SIZE: 8
      DDCL_TEMPLATE_PATH: ${DDCL_TEMPLATE_PATH:-/app/template/DDCL BCAS PROD 202611 - TEMPLATE.xlsx}
      # libpq settings for scripts/start-prod.sh (psql, pg_dump). Not DATABASE_URL: it carries Prisma-only options.
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
    # Rotation for the JSON logs, which now include login and audit events (docker compose logs).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    ports:
      - '${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'
    volumes:
      # Template Excel is not in git: put it in ./template/ on the host (read-only in the container).
      - ./template:/app/template:ro
      # Pre-migration dumps. A named volume, not a folder in the repo: the dumps hold unmasked operational
      # data and must not be synced by OneDrive or committed. `docker compose down -v` deletes it.
      - ddcl_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Plain node one-liner: no extra tools in the image. 127.0.0.1 avoids IPv6 localhost issues.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.BACKEND_PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      # A pre-migration dump and the migration itself can take minutes on a large database.
      start_period: 300s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  ddcl_pgdata:
  ddcl_backups:
